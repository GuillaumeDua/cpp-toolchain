name: Feature request
description: New stage, cross target, build argument, versioning change, ...
labels: [enhancement]
body:
  - type: textarea
    id: motivation
    attributes:
      label: Problem / motivation
      description: What is missing or awkward today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should change - a new stage, cross target, build-arg, tag scheme, ...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches and why they fall short
