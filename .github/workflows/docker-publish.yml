name: docker-publish

# Pushes images to Docker Hub and GHCR.
# docs/RELEASE_PROCESS.md is the runbook: the release model, the cadence, the urgent-fix path and the failure modes are documented there, and stated nowhere else.
#
# - an rc is a fresh build published as a pre-release,
#   which opens a candidate pull request adding releases/v1.2.yaml - the manifest digest of every stage it pushed.
# - a minor is that PR being merged: the promote job re-tags the recorded digests,
#   so the release is byte-identical to the rc that was validated.
# - a major is a hand-cut vX.0 release, fresh build.
#
# Tags are `<stage>-<version>`, with a `cross-` infix for the cross-arch variant,
# and `dev` also owns the unprefixed aliases (v1.2, latest, cross-v1.2, cross-latest) as the default target.
# README.md#tags--versioning has the full scheme.
#
# Two rules the steps below rely on and cannot state for themselves:
#   - releases/ is excluded from the skip-when-unchanged comparison.
#     Every promotion merges a record onto main, so without the exclusion each release would spawn a pointless rc at the next cron,
#     from a tree whose image inputs have not moved.
#   - events triggered by GITHUB_TOKEN start no workflow runs, which cuts both ways here:
#     - the release created here does not re-trigger this workflow (a PAT there would be an infinite build loop),
#     - the candidate PR must therefore be created with RELEASE_PR_TOKEN or its checks would never run.
#     Same reason its merge has to be a human, never a token.
#
# The build job holds all of its permissions for all of its steps, including the 15-to-25-minute build.
# Splitting the PR upkeep into a separate job would cost an artifact hop per output,
# and the build runs no third-party code beyond the pinned actions.
on:
  release:
    types: [published] # major (vX.0), cut by hand - always a fresh build
  push:
    branches: [main]
    paths: ["releases/**"] # a merged candidate PR - the promotion path
  schedule:
    - cron: "0 4 8,22 * *" # 8th and 22nd 4am UTC -> next rc pre-release
  workflow_dispatch: {} # manual -> rc pre-release

permissions:
  contents: write # create/edit releases
  packages: write # GHCR
  pull-requests: write # close superseded candidate PRs (creation uses RELEASE_PR_TOKEN)
  issues: write # opens, updates and closes the build failure issue

# Two paths mutate `latest` (a promotion and a major build), and runs can overlap - a cron while a promotion is in flight.
# Queue, never cancel: cancelling mid-push manufactures exactly the partial-registry state the digest assertions exist to catch.
concurrency:
  group: docker-publish
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------------------------------
  # Promotion: a releases/v*.yaml merged onto main.
  # No build - the recorded digests are verified against both registries, then re-tagged.
  # Seconds instead of 15-25 minutes, and the release is byte-identical to the rc that was validated.
  # ------------------------------------------------------------------------------------------
  promote:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # tags for the supersession assert, history for the release-note diff

      # The merge commit's first parent is the main that was merged onto, so this diff is exactly what the PR changed.
      - name: Identify the promotion record
        id: record
        uses: ./.github/actions/identify-promotion-record
        with:
          base-ref: ${{ github.sha }}^1
          head-ref: ${{ github.sha }}
          context: merge

      # All asserts run before any mutation: schema, candidate tag -> commit, containment in main, newest-rc supersession.
      # A hand-crafted YAML in an ordinary PR reaches this same trigger, so none of this trusts the candidate PR machinery.
      - name: Validate the record
        if: steps.record.outputs.skip != 'true'
        env:
          FILE: ${{ steps.record.outputs.file }}
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          python3 scripts/details/check-release-file.py "${FILE}" --check-git
          git tag -l | python3 scripts/details/check-release-file.py "${FILE}" --check-supersession
          python3 scripts/details/check-release-file.py "${FILE}" --print-targets > plan.txt
          cat plan.txt

      # With the asserts, before any tag moves: the changelog half reaches over the network, and a
      # failure once the re-tag has run leaves the registries on the new release with no release page.
      # Rendered at the recorded commit, not the merge commit:
      # if main moved between the rc and the merge, the merge commit's Dockerfile is newer than the image,
      # and rendering from it would describe pins the image does not have.
      # `target_commitish` carries that through to the changelog half: it bounds the pull request range,
      # and it is the ref generate-notes reads .github/release.yml from.
      - name: Render the release note
        if: steps.record.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FILE: ${{ steps.record.outputs.file }}
          VERSION: ${{ steps.record.outputs.version }}
          RC_COMMIT: ${{ steps.record.outputs.commit }}
        run: |
          set -euo pipefail
          # `previous` is empty only for a first release, where generate-notes bounds the range itself.
          previous=$(python3 scripts/details/check-release-file.py --print-newest-release --tag "${VERSION}")
          gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${VERSION}" \
            -f target_commitish="${RC_COMMIT}" \
            ${previous:+-f "previous_tag_name=${previous}"} \
            --jq .body > changelog.md
          # A release already carrying a date keeps it: a rollback re-runs an old promotion, and
          # re-dating the note there would say the release shipped on the day it was restored.
          date=$(gh release view "${VERSION}" --json body --jq .body 2>/dev/null \
                 | grep -oP "^## What.s inside \\S+ - \\K[0-9-]+" || true)
          python3 scripts/details/render-manifest.py \
            --tag "${VERSION}" --ref "${RC_COMMIT}" --date "${date:-$(date -u +%F)}" \
            --changelog changelog.md --versions "${FILE}" > note.md
          cat note.md >> "$GITHUB_STEP_SUMMARY"

      - name: Log in to both registries
        if: steps.record.outputs.skip != 'true'
        uses: ./.github/actions/registry-login
        with:
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
          ghcr-username: ${{ github.actor }}
          ghcr-token: ${{ secrets.GITHUB_TOKEN }}

      # An alarm, not a correctness requirement - the re-tag below sources from the digest,
      # so it would ship the right bytes even if a tag had moved.
      # But a moved rc tag means either a re-run (this candidate is stale) or tampering, and both warrant a stop, not a silent recovery.
      - name: Assert the rc digests have not moved
        if: steps.record.outputs.skip != 'true'
        run: |
          set -euo pipefail
          images=$(python3 scripts/details/check-release-file.py --print-registries)
          while read -r digest source release latest; do
            for image in ${images}; do
              actual=$(docker buildx imagetools inspect "${image}:${source}" --format '{{.Manifest.Digest}}')
              if [ "${actual}" != "${digest}" ]; then
                echo "::error::${image}:${source} is ${actual}, but the record says ${digest} - the rc moved since it was built. This is not the artifact you validated: cut a fresh rc."
                exit 1
              fi
            done
          done < plan.txt
          echo "all recorded digests verified on both registries"

      # `docker buildx imagetools create` cannot re-tag without rewriting: given one manifest it
      # publishes a fresh single-entry index wrapping it, so the release tag resolves to a digest that
      # appears nowhere in releases/.
      # `crane tag` re-puts the manifest bytes untouched instead.
      #   Taken out of the published image rather than from a setup action or a release tarball:
      #   a digest is the only pin Renovate can move together with the version it belongs to, and
      #   an action whose body downloads an unverified binary would undo the digest-pinning every
      #   other action here carries. The binary is copied out and run natively - the image is
      #   distroless, so there is no shell in it to run a loop with.
      - name: Install crane
        if: steps.record.outputs.skip != 'true'
        env:
          # renovate: datasource=docker
          CRANE_IMAGE: gcr.io/go-containerregistry/crane:v0.22.1@sha256:1f968817b95790bed063f71175aa6b8ff879fa17064020415f3e18bb6e6a36e1
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/bin"
          container=$(docker create "${CRANE_IMAGE}")
          docker cp "${container}:/ko-app/crane" "${RUNNER_TEMP}/bin/crane"
          docker rm --volumes "${container}" > /dev/null
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
          "${RUNNER_TEMP}/bin/crane" version

      # A tag is a pointer to a manifest, so moving one must not rewrite what it points at:
      # `crane tag` PUTs the bytes it fetched, and a digest is the hash of those bytes, so the release
      # tag resolves to exactly what releases/v*.yaml records. The step below asserts it did.
      #   Re-putting identical bytes is a no-op, which is what makes a re-run of this job safe.
      #   crane reads the credentials `registry-login` wrote to ~/.docker/config.json.
      - name: Re-tag the digests
        if: steps.record.outputs.skip != 'true'
        run: |
          set -euo pipefail
          images=$(python3 scripts/details/check-release-file.py --print-registries)
          while read -r digest source release latest; do
            for image in ${images}; do
              echo "::group::${image}:${release} + :${latest} <- ${digest}"
              crane tag "${image}@${digest}" "${release}"
              crane tag "${image}@${digest}" "${latest}"
              echo "::endgroup::"
            done
          done < plan.txt

      # The promotion guarantee, checked rather than argued: what a consumer pulls under the release
      # tag is the digest git holds for the rc that was validated.
      # Late by necessity - it is the only assert here that describes state this job created.
      - name: Assert the release tags resolve to the recorded digests
        if: steps.record.outputs.skip != 'true'
        run: |
          set -euo pipefail
          images=$(python3 scripts/details/check-release-file.py --print-registries)
          while read -r digest source release latest; do
            for image in ${images}; do
              for tag in "${release}" "${latest}"; do
                actual=$(docker buildx imagetools inspect "${image}:${tag}" --format '{{.Manifest.Digest}}')
                if [ "${actual}" != "${digest}" ]; then
                  echo "::error::${image}:${tag} resolves to ${actual}, not the recorded ${digest} - the re-tag rewrote the manifest instead of pointing at it."
                  exit 1
                fi
              done
            done
          done < plan.txt
          echo "every release tag resolves to its recorded digest on both registries"

      # The human's action was the merge, so no release exists yet - this job creates it, at the recorded commit (the exact tree the image was built from).
      # GITHUB_TOKEN-created releases fire no workflow runs, so this cannot re-trigger the release path. Upserts throughout,
      # so a re-run after a partial failure converges instead of erroring;
      # a tag already existing at a different commit is the one non-recoverable state, and fails.
      - name: Create the release
        if: steps.record.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.record.outputs.version }}
          RC_COMMIT: ${{ steps.record.outputs.commit }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            tagged=$(git rev-list -n1 "${VERSION}")
            if [ "${tagged}" != "${RC_COMMIT}" ]; then
              echo "::error::tag ${VERSION} already exists at ${tagged}, not the recorded commit ${RC_COMMIT} - refusing to move a release tag."
              exit 1
            fi
          fi
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            # Already exists: a records merge for a hand-cut major, or a re-run. Replace only the
            # marked manifest region, so hand-written release prose survives.
            gh release view "${VERSION}" --json body -q .body > body.md || true
            python3 scripts/details/render-manifest.py \
              --replace-region manifest --with note.md < body.md > merged.md
            gh release edit "${VERSION}" --notes-file merged.md
          else
            gh release create "${VERSION}" \
              --target "${RC_COMMIT}" \
              --title  "${VERSION}" \
              --notes-file note.md
          fi

      # The rc pre-release is kept forever (its digests are shared with the release,
      # so deleting it is unsafe - see docs/RELEASE_PROCESS.md), which means readers can still land on it.
      # Point them at the stable release it became, in a marked region like the manifest,
      # so a re-run replaces the banner instead of stacking copies.
      # A records file has no candidate, and a missing pre-release is a warning, not a failure:
      # the release is already out, this banner is a courtesy.
      - name: Mark the rc pre-release as promoted
        if: steps.record.outputs.skip != 'true' && steps.record.outputs.candidate != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.record.outputs.version }}
          CANDIDATE: ${{ steps.record.outputs.candidate }}
        run: |
          set -euo pipefail
          if ! gh release view "${CANDIDATE}" --json body -q .body > rc-body.md 2>/dev/null; then
            echo "::warning::no pre-release found for ${CANDIDATE} - nothing to mark as promoted."
            exit 0
          fi
          {
            echo "<!-- promoted:begin -->"
            echo "> [!IMPORTANT]"
            echo "> Promoted to [${VERSION}](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${VERSION}) - same digests, byte-identical.  "
            echo "> Use the stable release; this pre-release remains as the record of what was validated."
            echo "<!-- promoted:end -->"
          } > banner.md
          python3 scripts/details/render-manifest.py \
            --replace-region promoted --with banner.md --when-absent prepend < rc-body.md > rc-merged.md
          gh release edit "${CANDIDATE}" --notes-file rc-merged.md

  # ------------------------------------------------------------------------------------------
  # Fresh build: an rc (schedule / dispatch) or a hand-cut major (release).
  # Builds and pushes every stage, then opens the pull request whose merge is the promotion.
  # ------------------------------------------------------------------------------------------
  build-and-push:
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    # How many times the whole build is attempted - the upstream apt hosts are why.
    # Job-level so the retry loop and the failure issue quote one number.
    env:
      MAX_BUILD_ATTEMPTS: 3
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # need history + tags to assert containment in main and to compute the next version

      # Minors are promoted by merging a candidate PR, never by cutting a release.
      # a hand-cut v1.2 here would silently rebuild instead of promoting, shipping an artifact nobody tested.
      #   NB: the tag is untrusted input -> passed via env, never interpolated into the script.
      - name: Assert release tag format
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.0$ ]]; then
            echo "::error::Release tag '${RELEASE_TAG}' is not a major (v<major>.0). Minors are promoted by merging the open candidate PR - see docs/RELEASE_PROCESS.md."
            exit 1
          fi
          echo "Release tag '${RELEASE_TAG}' is well-formed."

      # Publish from main only: a release/tag can be cut from any commit, so verify the commit being built is actually contained in main before pushing anything.
      # Covers release, schedule (always main) and workflow_dispatch (could be triggered from any branch).
      - name: Assert we are publishing from main
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::${GITHUB_SHA} is not contained in main - refusing to publish."
            exit 1
          fi

      # Two modes, discriminated by the trigger:
      #   release -> the vX.0 tag the human cut, + `latest`
      #   rc      -> the next `v<major>.<minor+1>-rc.<n>`, no alias (cron, or manual dispatch)
      - name: Resolve image tags
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          # Newest existing release tag. check-release-file.py owns the rule - which tags count as
          # releases, and how they order - so the minor derived here and the base the release note
          # diffs against are the same answer rather than two spellings of it.
          #   It fails rather than answering "none" when the tags are unreachable, so an incomplete
          #   checkout cannot restart the line at v1.0 over an existing release.
          newest=$(python3 scripts/details/check-release-file.py --print-newest-release)

          # Next minor: bump the newest release's minor, or start the line at v1.0.
          if [ -z "${newest}" ]; then
            next="v1.0"
          else
            major="${newest%%.*}"; major="${major#v}"
            minor="${newest##*.}"
            next="v${major}.$((minor + 1))"
          fi

          if [ "${EVENT_NAME}" = "release" ]; then
            mode=release
            version="${RELEASE_TAG}"
            primary="${RELEASE_TAG}"
            tags="${RELEASE_TAG} latest"
          else
            mode=rc
            # rc counter is per target minor, and resets when that minor ships.
            last_rc=$(git tag -l "${next}-rc.*" | sed 's/.*-rc\.//' | sort -n | tail -1 || true)
            version="${next}"
            primary="${next}-rc.$(( ${last_rc:-0} + 1 ))"
            tags="${primary}" # a pre-release never moves `latest`
          fi

          {
            echo "mode=${mode}"
            echo "version=${version}"
            echo "primary=${primary}"
            echo "tags=${tags}"
          } >> "$GITHUB_OUTPUT"

          echo "mode=[${mode}] version=[${version}] primary=[${primary}] tags=[${tags}]"

      # Nothing to publish if the image inputs have not moved since the last tag:
      # every version is pinned, so the rebuild would be identical to what is already published.
      #   releases/ is excluded: a promotion merge changes only the record, not the image, and must not count as "something to build".
      #   A manual dispatch overrides it - that is the escape hatch for forcing a rebuild.
      - name: Skip when nothing changed
        id: changed
        if: github.event_name == 'schedule'
        run: |
          set -euo pipefail
          latest_tag=$(git for-each-ref --sort=-creatordate --format='%(refname:short)' 'refs/tags/v*' | head -1)

          if [ -z "${latest_tag}" ]; then
            echo "no tags yet - proceeding"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet "${latest_tag}" "${GITHUB_SHA}" -- . ':(exclude)releases'; then
            echo "::notice::nothing outside releases/ changed since ${latest_tag} - the image would be identical, publishing nothing."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "changes since ${latest_tag} ($(git rev-list --count "${latest_tag}..${GITHUB_SHA}") commit(s)) - proceeding"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # The note is rendered after the build, because the installed versions come out of the pushed
      # images. The pins and the changelog do not, so they are exercised here: a renderer or API
      # failure found after a 15-to-25-minute build would leave images in both registries under a
      # tag git never learns about.
      #   generate-notes answers for a tag that does not exist yet, which is what makes the
      #   changelog half reachable this early - and it is the call that parses .github/release.yml.
      - name: Validate the release note renders
        if: steps.changed.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRIMARY: ${{ steps.meta.outputs.primary }}
        run: |
          set -euo pipefail
          # `previous` is empty only for a first release, where generate-notes bounds the range itself.
          previous=$(python3 scripts/details/check-release-file.py --print-newest-release --tag "${PRIMARY}")
          gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${PRIMARY}" \
            -f target_commitish="${GITHUB_SHA}" \
            ${previous:+-f "previous_tag_name=${previous}"} \
            --jq .body > changelog.md
          python3 scripts/details/render-manifest.py --tag "${PRIMARY}" --changelog changelog.md > /dev/null
          echo "the release note renders, and .github/release.yml parses"

      - name: Set up Docker Buildx
        if: steps.changed.outputs.skip != 'true'
        uses: ./.github/actions/setup-buildx

      - name: Log in to both registries
        if: steps.changed.outputs.skip != 'true'
        uses: ./.github/actions/registry-login
        with:
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
          ghcr-username: ${{ github.actor }}
          ghcr-token: ${{ secrets.GITHUB_TOKEN }}

      # Single job, built in dependency order on one buildx builder:
      #   the heavy `build` layer is produced once and reused by static-analysis / documentation / dev
      # The gha cache is a plain speed-up here:
      #   with every version pinned, a cache hit means the inputs really are unchanged, so replaying a layer cannot smuggle in a stale toolchain.
      # Each build writes a metadata file:
      #   the digests in there become the promotion record, so whatever this step pushes is exactly what a later promotion re-tags.
      - name: Validate, then build and push all stages
        if: steps.changed.outputs.skip != 'true'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail

          # Read-only against the scopes a merge to main maintains: one exporter per scope, and merges
          #   refresh them far more often than this workflow's fortnightly cron.
          build() { bash scripts/details/build-stages.sh --cache read "$@"; }

          stages() { python3 scripts/details/check-release-file.py --print-stages "$1"; }

          # Validate before publishing, so a stage that lost a package never reaches a registry.
          #   `cacheonly` because only the exit status matters - nothing is loaded or pushed,
          #   and the layers these solves build are the ones the pushes then reuse from the local cache.
          # Normal variant first, so its shared toolchain layers populate the local cache the cross pass reuses.
          #   `runtime` carries no toolchain, so it gets no cross variant (a cross runtime would be byte-identical).
          publish_all_stages() {
            build --variant normal --output cacheonly $(stages validate-normal) || return 1
            build --variant cross  --output cacheonly $(stages validate-cross)  || return 1
            build --variant normal --push --tags "${TAGS}" --metadata-dir build-metadata $(stages normal) || return 1
            build --variant cross  --push --tags "${TAGS}" --metadata-dir build-metadata $(stages cross)  || return 1
          }

          # apt.llvm.org and snapshot.ubuntu.com both fail intermittently,
          #   and a fetch that fails twenty minutes in would otherwise cost the whole window until the next cron.
          #   A retry resumes at the failing layer: everything already solved is in the builder's local cache.
          #   The backoff outlasts the throttling window apt.llvm.org applies (scripts/install/llvm.sh).
          attempt=1
          until publish_all_stages; do
            if [ "${attempt}" -ge "${MAX_BUILD_ATTEMPTS}" ]; then
              echo "::error::every one of the ${MAX_BUILD_ATTEMPTS} build attempts failed"
              exit 1
            fi
            echo "::warning::build attempt ${attempt}/${MAX_BUILD_ATTEMPTS} failed - retrying in $(( attempt * 60 ))s"
            sleep $(( attempt * 60 ))
            attempt=$(( attempt + 1 ))
          done

      # The only place these answers exist: GCC and Clang pin a major and install from rolling apt
      # sources, and the standard libraries arrive as dependencies with no pin at all.
      #   One stage, named by check-release-file.py, because `buildx --push` leaves nothing in the
      #   local image store and collecting therefore means pulling.
      #   scripts/ is mounted whole rather than scripts/details: the collector composes scripts/install
      #   and scripts/checks, in the layout the Dockerfile gives the validate stages.
      - name: Collect the installed versions
        if: steps.changed.outputs.skip != 'true'
        run: |
          set -euo pipefail
          image=$(python3 scripts/details/check-release-file.py --print-registries ghcr)
          stage=$(python3 scripts/details/check-release-file.py --print-versioned-stage)
          digest=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["containerimage.digest"])' \
            "build-metadata/${stage}.json")
          echo "collecting from ${stage} ${digest}"
          docker run --rm \
            --volume "${PWD}/scripts:/opt/cpp-toolchain-scripts:ro" \
            "${image}@${digest}" \
            bash /opt/cpp-toolchain-scripts/details/cxx-toolchain-versions.sh \
            | tee build-metadata/versions.txt

      # The promotion record:
      #   the digest of every stage just pushed, the generated bumps, and what the images installed.
      #   Composed from the build metadata and validated on the spot - a partial build must fail here, not at promotion time.
      - name: Compose the promotion record
        if: success() && steps.changed.outputs.skip != 'true'
        env:
          MODE: ${{ steps.meta.outputs.mode }}
          VERSION: ${{ steps.meta.outputs.version }}
          PRIMARY: ${{ steps.meta.outputs.primary }}
        run: |
          set -euo pipefail
          mkdir -p releases

          digest_of() {
            python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["containerimage.digest"])' \
              "build-metadata/$1.json"
          }

          {
            echo "version: \"${VERSION}\""
            [ "${MODE}" = "rc" ] && echo "candidate: \"${PRIMARY}\""
            echo "commit: \"${GITHUB_SHA}\""
            echo "digests:"
            for stage in $(python3 scripts/details/check-release-file.py --print-stages normal); do
              echo "  ${stage}: \"$(digest_of "${stage}")\""
            done
            for stage in $(python3 scripts/details/check-release-file.py --print-stages cross); do
              echo "  ${stage}-cross: \"$(digest_of "${stage}-cross")\""
            done
            python3 scripts/details/render-manifest.py --tag "${VERSION}" --bumps-yaml
            python3 scripts/details/render-manifest.py --collected build-metadata/versions.txt
          } > "releases/${VERSION}.yaml"

          cat "releases/${VERSION}.yaml"
          python3 scripts/details/check-release-file.py "releases/${VERSION}.yaml"

      # After the record, which is where the installed versions live: the note reports them, and the
      # previous release's record is what it diffs them against.
      # The pins and the changelog already rendered before the build - this is the same note with the
      # half that needed the images, so a failure here costs a re-run rather than the build window.
      - name: Render the release note
        if: success() && steps.changed.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
          PRIMARY: ${{ steps.meta.outputs.primary }}
        run: |
          set -euo pipefail
          previous=$(python3 scripts/details/check-release-file.py --print-newest-release --tag "${PRIMARY}")
          gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${PRIMARY}" \
            -f target_commitish="${GITHUB_SHA}" \
            ${previous:+-f "previous_tag_name=${previous}"} \
            --jq .body > changelog.md
          python3 scripts/details/render-manifest.py \
            --tag "${PRIMARY}" --date "$(date -u +%F)" \
            --changelog changelog.md --versions "releases/${VERSION}.yaml" > note.md
          cat note.md >> "$GITHUB_STEP_SUMMARY"

      # The rc pre-release is what mints the v1.2-rc.N git tag:
      #   candidate verification, the skip check and the rc counter all key off it.
      # Created only on success, so a failed build never mints a tag.
      # --target is the exact commit that was built, not the branch, so a concurrent push to main cannot move the tag off it.
      - name: Create the pre-release
        if: success() && steps.changed.outputs.skip != 'true' && steps.meta.outputs.mode == 'rc'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRIMARY: ${{ steps.meta.outputs.primary }}
        run: |
          set -euo pipefail
          gh release create "${PRIMARY}" \
            --target "${GITHUB_SHA}" \
            --title  "${PRIMARY}" \
            --prerelease \
            --notes-file note.md

      # Manual major:
      #   the release already exists and may carry hand-written prose.
      #   Replace only the marked region, so re-running this workflow is idempotent and your own text survives.
      - name: Append the manifest to the release note
        if: success() && steps.changed.outputs.skip != 'true' && steps.meta.outputs.mode == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRIMARY: ${{ steps.meta.outputs.primary }}
        run: |
          set -euo pipefail
          gh release view "${PRIMARY}" --json body -q .body > body.md || true
          python3 scripts/details/render-manifest.py \
            --replace-region manifest --with note.md < body.md > merged.md
          gh release edit "${PRIMARY}" --notes-file merged.md

      # The branch is pushed with GITHUB_TOKEN (nothing subscribes to release/* branches),
      # but the PR itself is created with RELEASE_PR_TOKEN - see the token notes in the header.
      # Upserts, so a re-run refreshes the PR instead of failing on "already exists".
      - name: Open the promotion pull request
        if: success() && steps.changed.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
          MODE: ${{ steps.meta.outputs.mode }}
          VERSION: ${{ steps.meta.outputs.version }}
          PRIMARY: ${{ steps.meta.outputs.primary }}
        run: |
          set -euo pipefail
          if [ "${MODE}" = "rc" ]; then
            branch="release/candidate/${PRIMARY}"
            title="Promote ${PRIMARY}"
            {
              echo "Merging this pull request promotes \`${PRIMARY}\` to \`${VERSION}\` and moves \`latest\`:"
              echo "the digests recorded in \`releases/${VERSION}.yaml\` are re-tagged, byte-identical, no rebuild."
              echo
              echo "Candidate built: $(date -u +%F) - see [docs/RELEASE_PROCESS.md](docs/RELEASE_PROCESS.md)."
              echo
              cat note.md
            } > pr-body.md
          else
            branch="release/records/${PRIMARY}"
            title="Promotion record for ${PRIMARY}"
            {
              echo "Bookkeeping for the hand-cut \`${PRIMARY}\` release: \`releases/${VERSION}.yaml\` records"
              echo "the digests just published, so releases/ stays the complete record rollbacks read from."
              echo "Merging re-fires the promote job, which is an idempotent no-op re-tag."
              echo
              cat note.md
            } > pr-body.md
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "${branch}"
          git add "releases/${VERSION}.yaml"
          git commit -m "${title}"
          git push -f origin "${branch}"

          # The label is what keeps this bookkeeping out of the next release's changelog - see .github/release.yml.
          if gh pr list --state open --head "${branch}" --json number --jq length | grep -qx 0; then
            gh pr create --base main --head "${branch}" --title "${title}" --body-file pr-body.md \
              --label release-candidate
          else
            gh pr edit "${branch}" --title "${title}" --body-file pr-body.md \
              --add-label release-candidate
          fi

      # One open candidate at all times, so there is never doubt about which rc is current.
      # Closing destroys nothing (the images and the pre-release stay),
      # and closing with GITHUB_TOKEN is fine - nothing needs to fire on a close.
      - name: Close superseded candidate PRs
        if: success() && steps.changed.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ steps.meta.outputs.mode }}
          PRIMARY: ${{ steps.meta.outputs.primary }}
        run: |
          set -euo pipefail
          current="release/candidate/${PRIMARY}"
          [ "${MODE}" = "release" ] && current="" # a major obsoletes every open candidate
          gh pr list --state open --json number,headRefName \
            --jq '.[] | [.number, .headRefName] | @tsv' \
          | while IFS=$'\t' read -r number head; do
              case "${head}" in
                release/candidate/*) ;;
                *) continue ;;
              esac
              [ "${head}" = "${current}" ] && continue
              echo "closing superseded candidate PR #${number} (${head})"
              gh pr comment "${number}" --body "Superseded by ${PRIMARY}."
              gh pr close "${number}" --delete-branch
            done

      # Every tag move (`latest`) orphans the digest it pointed at.
      # GHCR keeps those as untagged versions forever; Docker Hub garbage-collects its own.
      #   This sweep is only safe because the builds above pin `--provenance=false --sbom=false`:
      #   buildx attestations are published as untagged child manifests of a tagged index,
      #   and an untagged sweep would delete them out from under it.
      - name: Prune untagged GHCR versions
        if: success() && steps.changed.outputs.skip != 'true'
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: cpp-toolchain
          package-type: container
          delete-only-untagged-versions: true
          min-versions-to-keep: 0

      # A failed build leaves no pre-release and no candidate PR, so it reads as a quiet fortnight
      #   rather than as a failure - see the failure modes table in docs/RELEASE_PROCESS.md.
      - name: Compose the build failure report
        id: failure
        if: always() && job.status != 'cancelled'
        env:
          JOB_STATUS: ${{ job.status }}
          PRIMARY: ${{ steps.meta.outputs.primary }}
        run: |
          set -euo pipefail

          if [[ "${JOB_STATUS}" == "success" ]]; then
              echo "resolved=true" >> "$GITHUB_OUTPUT"
              exit 0
          fi
          echo "resolved=false" >> "$GITHUB_OUTPUT"

          {
              echo "The image build failed, so no pre-release and no candidate pull request were produced."
              echo
              echo "- commit: ${GITHUB_SHA}"
              echo "- trigger: ${GITHUB_EVENT_NAME}"
              echo "- intended tag: ${PRIMARY:-(not resolved - the run failed before the tag was computed)}"
              echo "- run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              echo
              echo "The build is attempted ${MAX_BUILD_ATTEMPTS} times with a backoff before this fires,"
              echo "so a single upstream blip does not reach here: read the log before re-running."
              echo
              echo "Re-run it with:"
              echo
              echo '```bash'
              echo "gh run rerun ${GITHUB_RUN_ID} --failed"
              echo '```'
              echo
              echo "Opened by .github/workflows/docker-publish.yml, rewritten on every run, and closed once a build succeeds."
          } > build-failure.md

      - name: Report a failed build
        if: always() && job.status != 'cancelled'
        uses: ./.github/actions/report-sticky-issue
        with:
          title: "release: the image build is failing"
          body-file: build-failure.md
          resolved: ${{ steps.failure.outputs.resolved }}
          close-comment: "Green again at ${{ github.sha }}${{ steps.meta.outputs.primary && format(' ({0})', steps.meta.outputs.primary) }}."
          token: ${{ github.token }}
