name: docker-build

# Gate: every PR to main, and every push to main, must still produce (not publish !) all five images and the cross-arch toolchain.
#   Deliberately NOT path-filtered: a required status check that never runs leaves the PR waiting forever on a status that never reports.
#   Nothing is pushed, so no registry credentials are needed and the gate works for PRs from forks, which have no access to secrets.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docker-build-${{ github.ref }}
  # Never on a push to main: that run is the cache producer, and cancelling it leaves the next PR cold.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Assert every version is pinned and watched
        run: python3 scripts/details/check-dependencies-pins.py

      - name: Assert the install scripts' shared helpers have not drifted
        run: python3 scripts/details/check-install-script-parity.py

      - name: Assert every action is pinned to a commit digest
        run: python3 scripts/details/check-action-pins.py

      # `type=gha` reads ACTIONS_RUNTIME_TOKEN and ACTIONS_RESULTS_URL, which GitHub hands to an action but not to an inline `run:` step.
      # Without them the cache flags below resolve to nothing, silently, and every run is a cold build.
      - name: Expose the Actions runtime to the inline buildx call
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build all stages (no push)
        run: |
          set -euo pipefail

          # `common` is an alias resolved by scripts/install/binutils.sh, which is where the triplets are listed.
          CROSS_TARGETS="common"

          # Layer cache, keyed <BINUTILS_TARGETS>:<stage> and valued by the scope that build exports.
          #   A merge to main is the only writer: a cache written from a PR is scoped to that PR and serves nothing but its own re-runs.
          #   One scope per exporting build - a second export to a scope replaces it, "leaving only the final cache" (https://docs.docker.com/build/cache/backends/gha/).
          #   Scopes are cheap: blobs are keyed by digest and only the index is scoped, so what the scopes share is stored once.
          #   These three carry every layer a PR builds - the runtime -> build -> static-analysis -> dev chain, documentation's branch off build, and the cross binutils tail.
          declare -A CACHE_EXPORTS=(
            [":dev"]=cpp-toolchain-dev
            [":documentation"]=cpp-toolchain-documentation
            ["${CROSS_TARGETS}:build"]=cpp-toolchain-build-cross
          )

          CACHE_FROM=()
          for scope in "${CACHE_EXPORTS[@]}"; do
            CACHE_FROM+=(--cache-from "type=gha,scope=${scope}")
          done

          # $1 = BINUTILS_TARGETS, $2.. = stages.
          build_variant() {
            local targets="$1"; shift
            local target scope
            local -a cache_to
            for target in "$@"; do
              cache_to=()
              scope="${CACHE_EXPORTS["${targets}:${target}"]:-}"
              if [[ -n "${scope}" && "${GITHUB_EVENT_NAME}" == "push" ]]; then
                cache_to=(--cache-to "type=gha,mode=max,scope=${scope}")
              fi
              echo "::group::build cpp-toolchain:${target} [BINUTILS_TARGETS='${targets}']"
              docker buildx build \
                --file Dockerfile \
                --target "${target}" \
                --build-arg "BINUTILS_TARGETS=${targets}" \
                "${CACHE_FROM[@]}" \
                "${cache_to[@]}" \
                .
              echo "::endgroup::"
            done
          }

          # validate-build / validate-runtime are the image validation gate (docs/IMAGES_VALIDATION.md).
          build_variant "" runtime build validate-build validate-runtime static-analysis documentation dev

          # The cross variant has no `runtime`, hence no validate-runtime.
          #   BINUTILS_TARGETS is consumed at the tail of `build`, so cross `build` reuses everything below it from the builder's local cache.
          #   Every stage above is re-parented and rebuilds in full, for package sets the normal variant has already built.
          CROSS_STAGES=(build validate-build)
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            CROSS_STAGES+=(static-analysis documentation dev)
          fi
          build_variant "${CROSS_TARGETS}" "${CROSS_STAGES[@]}"
