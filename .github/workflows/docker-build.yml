name: docker-build

# Gate: every PR to main (and every push to main) must still produce (not publish !) all five images,
# and the cross-arch variant of `build`.
#
# Deliberately NOT path-filtered: this is meant to be a required status check,
# and a path-filtered workflow that never runs leaves the PR waiting forever on a check that never reports.
# When the Dockerfile/scripts are untouched, a PR replays the layers a merge to main exported, and the run is a near-no-op.
#
# Nothing is pushed here, so no registry credentials are needed,
# and the gate also works for pull requests coming from forks (which have no access to secrets).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docker-build-${{ github.ref }}
  # Never on a push to main: that run is the cache producer, and cancelling it leaves the next PR cold.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assert every version is pinned and watched
        run: python3 scripts/details/check-dependencies-pins.py

      - name: Assert the install scripts' shared helpers have not drifted
        run: python3 scripts/details/check-install-script-parity.py

      # `type=gha` reads ACTIONS_RUNTIME_TOKEN and ACTIONS_RESULTS_URL, which GitHub hands to an action
      # but not to an inline `run:` step - and the buildx call below is one.
      # Without this the cache flags resolve to nothing, silently, and every run is a cold build.
      - name: Expose the Actions runtime to the inline buildx call
        uses: crazy-max/ghaction-github-runtime@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Built in dependency order on a single buildx builder:
      #   the heavy `build` layer is produced once and reused by static-analysis / documentation / dev.
      # Both image variants are gated: normal/lean (BINUTILS_TARGETS='') and cross-arch (a triplet list), so a break in either is caught.
      - name: Build all stages (no push)
        run: |
          set -euo pipefail

          # Cross-arch target triplets for the `-cross` image variant.
          #   `common` is an alias resolved by scripts/install/binutils.sh, which is where the triplets are listed
          CROSS_TARGETS="common"

          # A PR reads the shared cache; only a merge to main writes it.
          #   `dev` covers runtime -> build -> static-analysis -> dev and `documentation` covers its own branch off
          #   `build`, so exporting from those two carries every publishable layer.
          #   validate-build / validate-runtime are left out for the reason docker-publish.yml gives:
          #   throwaway layers have no reason to occupy the shared cache.
          cache_args() {
            printf '%s\n' --cache-from type=gha,scope=cpp-toolchain
            if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
              case "$1" in
                documentation|dev) printf '%s\n' --cache-to type=gha,mode=max,scope=cpp-toolchain ;;
              esac
            fi
          }

          # Build one variant (no push). $1=BINUTILS_TARGETS build-arg, $2.. = stages.
          build_variant() {
            local targets="$1"; shift
            local target
            local -a cache
            for target in "$@"; do
              mapfile -t cache < <(cache_args "${target}")
              echo "::group::build cpp-toolchain:${target} [BINUTILS_TARGETS='${targets}']"
              docker buildx build \
                --file Dockerfile \
                --target "${target}" \
                --build-arg "BINUTILS_TARGETS=${targets}" \
                "${cache[@]}" \
                .
              echo "::endgroup::"
            done
          }

          # Normal variant first (populates the builder's local cache); `runtime` has no cross variant.
          # validate-build / validate-runtime are the image validation gate:
          # throwaway stages on top of layers this job already built, so they cost a cache hit plus their own RUN (see docs/IMAGES_VALIDATION.md).
          build_variant ""         runtime build validate-build validate-runtime static-analysis documentation dev

          # The cross variant has no `runtime`, hence no validate-runtime.
          #   BINUTILS_TARGETS is consumed at the tail of `build`, so changing it re-parents every stage below:
          #   the leaves cannot hit any cache and re-run their apt installs in full, ~17 min, to prove nothing the
          #   normal variant has not already proven. A PR therefore gates the cross toolchain and its validation,
          #   and the full cross matrix runs on the merge to main.
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            build_variant "${CROSS_TARGETS}" build validate-build                  static-analysis documentation dev
          else
            build_variant "${CROSS_TARGETS}" build validate-build
          fi
