name: docker-build

# Gate: every PR to main (and every push to main) must still produce (not publish !) all five images.
#
# Deliberately NOT path-filtered: this is meant to be a required status check,
# and a path-filtered workflow that never runs leaves the PR waiting forever on a check that never reports.
# When the Dockerfile/scripts are untouched the gha cache makes this a near-no-op.
#
# Nothing is pushed here, so no registry credentials are needed,
# and the gate also works for pull requests coming from forks (which have no access to secrets).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Two invariants the whole design rests on. Cheap, and they fail long before a 40-minute build.
      #   1. nothing floats - a `latest` / `master` value would make two builds of one commit differ
      #   2. nothing floats unwatched - a pin nobody updates silently rots
      - name: Assert every version is pinned and watched
        run: |
          set -euo pipefail

          floating=$(grep -nE '^ARG [A-Z0-9_]*(VERSION|VERSIONS|RELEASE|IMAGE|COMMIT|SNAPSHOT)[A-Z0-9_]*=.*(latest|master)' Dockerfile || true)
          if [ -n "${floating}" ]; then
            echo "::error::floating version(s) in the Dockerfile - every version must be pinned:"
            echo "${floating}"
            exit 1
          fi

          # `UBUNTU_SNAPSHOT` is watched by .github/workflows/ubuntu-snapshot.yml and `BASE_IMAGE` by its own renovate.json manager
          # (a digest pin needs currentValue/currentDigest split out), so neither carries the inline annotation the others do.
          python3 - <<'PY'
          import re, sys, pathlib
          lines = pathlib.Path("Dockerfile").read_text().split("\n")
          exempt = {"UBUNTU_SNAPSHOT", "BASE_IMAGE", "DEBIAN_FRONTEND", "BINUTILS_TARGETS"}
          unwatched = []
          for i, line in enumerate(lines):
              # [A-Z0-9_] not [A-Z_]: names carry digits (BUILD2_VERSION, POWERLEVEL10K_VERSION),
              # and a name this pattern misses is a pin that goes unchecked.
              m = re.match(r"ARG ([A-Z0-9_]*(?:VERSION|VERSIONS|RELEASE|COMMIT|SNAPSHOT)[A-Z0-9_]*)=(\S+)", line)
              if not m or m.group(1) in exempt:
                  continue
              if not (i and lines[i - 1].startswith("# renovate:")):
                  unwatched.append(f"  line {i+1}: {m.group(1)}={m.group(2)}")
          if unwatched:
              print("::error::pinned but not tracked by Renovate - add a `# renovate:` annotation directly above:")
              print("\n".join(unwatched))
              sys.exit(1)
          print("every version pin is annotated for Renovate")
          PY

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Built in dependency order on a single buildx builder:
      #   the heavy `build` layer is produced once and reused by static-analysis / documentation / dev.
      # Both image variants are gated: normal/lean (BINUTILS_TARGETS='') and cross-arch (a triplet list), so a break in either is caught.
      # Caching keeps the cross pass to just the tail binutils layer.
      - name: Build all stages (no push)
        run: |
          set -euo pipefail

          # Cross-arch target triplets for the cross-arch variant (single source of truth).
          CROSS_TARGETS="x86-64-linux-gnu aarch64-linux-gnu arm-linux-gnueabihf riscv64-linux-gnu"

          # Build one variant (no push). $1=BINUTILS_TARGETS build-arg, $2.. = stages.
          build_variant() {
            local targets="$1"; shift
            for target in "$@"; do
              echo "::group::build cpp-toolchain:${target} [BINUTILS_TARGETS='${targets}']"
              docker buildx build \
                --file Dockerfile \
                --target "${target}" \
                --build-arg "BINUTILS_TARGETS=${targets}" \
                --cache-from type=gha,scope=cpp-toolchain \
                .
              echo "::endgroup::"
            done
          }

          # Normal variant first (populates the shared cache); `runtime` has no cross variant.
          build_variant ""                 runtime build static-analysis documentation dev
          build_variant "${CROSS_TARGETS}" build static-analysis documentation dev
