name: docker-build

# Gate: every PR to main, and every push to main, must still produce (not publish !) all five images and the cross-arch toolchain.
#   Deliberately NOT path-filtered: a required status check that never runs leaves the PR waiting forever on a status that never reports.
#   No image is pushed, and a pull request imports the layer cache anonymously, so the gate works for PRs
#     from forks, which have no access to secrets.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  packages: write # a push to main exports the layer cache to the GHCR repository

concurrency:
  group: docker-build-${{ github.ref }}
  # Never on a push to main: that run is the cache producer, and cancelling it leaves the next PR cold.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Assert every version is pinned and watched
        run: python3 scripts/internal/host/check_dependencies_pins.py

      # The composed scripts are what each release publishes, and nothing else exercises them until then.
      # Composing here means a broken composer fails a pull request rather than a release.
      # The directory holds nothing but the script under test: no shared.sh, no repository around it,
      # which is the promise the published file makes.
      - name: Assert the standalone scripts compose and run on their own
        run: |
          set -euo pipefail
          island=$(mktemp -d)
          python3 scripts/internal/host/compose_standalone.py --all "${island}" scripts/install
          python3 scripts/internal/host/compose_standalone.py --all "${island}" scripts/checks
          cd "${island}"
          for script in *.sh; do
            bash -n "${script}"
            bash "${script}" --help > /dev/null 2>&1
          done
          bash install_gcc.sh          --list-installed > /dev/null
          bash install_llvm.sh         --list-installed > /dev/null
          bash install_binutils.sh     --list-targets   > /dev/null
          bash checks_cxx-standards.sh --greatest       > /dev/null
          bash checks_c-stdlibs.sh     --format=abi     > /dev/null
          bash checks_cxx-stdlibs.sh   --format=abi     > /dev/null
          echo "every standalone script composes and answers with nothing beside it"

      - name: Assert every action is pinned to a commit digest
        run: python3 scripts/internal/host/check_action_pins.py

      - name: Assert the Docker Hub description fits what Docker Hub accepts
        run: python3 scripts/internal/host/check_dockerhub_description.py

      - name: Test the release tooling
        run: python3 scripts/internal/host/test_release_tooling.py

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # The key for the archive the Dockerfile's /var/cache/apt mounts fill, and the directory holding it.
      #   The snapshot is the whole key: that archive is frozen, so a .deb fetched for it is never stale,
      #   and one rotating entry keeps this out of the way of the repository's 10 GB Actions budget.
      #   An empty match is fatal rather than a key of its own, which every build would then share
      #   while restoring an archive for no snapshot in particular.
      #   The directory is created here because the injection step reads it before anything has
      #   written it, on the first run against a key and on any run that misses.
      # KNOWN-LIMITATION: a tool version bumped without a snapshot bump is absent from the entry
      #   until the next rotation, and is fetched from the network until then.
      - name: Prepare the apt archive
        id: archive
        run: |
          set -euo pipefail
          snapshot=$(sed -n 's/^ARG UBUNTU_SNAPSHOT=//p' Dockerfile)
          [ -n "${snapshot}" ] || { echo "::error::no ARG UBUNTU_SNAPSHOT=<value> in Dockerfile"; exit 1; }
          mkdir -p .apt-cache
          echo "key=apt-archive-${snapshot}" >> "${GITHUB_OUTPUT}"

      # A merge to main is the only writer, for the reason the layer cache has one producer:
      # an entry written from a pull request is scoped to that branch and serves only its own re-runs.
      - name: Cache the apt archive
        id: apt-archive
        if: github.event_name == 'push'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .apt-cache
          key: ${{ steps.archive.outputs.key }}

      - name: Restore the apt archive
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .apt-cache
          key: ${{ steps.archive.outputs.key }}

      # A cache mount lives in the builder's local state: --cache-to does not export it and a runner
      #   starts with an empty builder, so it crosses runs only by being extracted and injected again
      #   (https://docs.docker.com/build/ci/github-actions/cache/#cache-mounts).
      #   Registered after the cache step so that step's post phase, which runs last, saves a directory
      #   this one's post phase has already written.
      #   Extraction is skipped where nothing will save it: a pull request, or a key already present.
      - name: Inject the apt archive into the build cache
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: '{".apt-cache": "/var/cache/apt"}'
          skip-extraction: ${{ github.event_name != 'push' || steps.apt-archive.outputs.cache-hit == 'true' }}

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build all stages (no push)
        run: |
          set -euo pipefail

          # A merge to main is the only cache writer: one written from a PR is scoped to that PR
          #   and serves nothing but its own re-runs.
          build() {
            local cache=read
            if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then cache=write; fi
            bash scripts/internal/host/build-stages.sh --cache "${cache}" --retries 3 "$@"
          }

          stages() { python3 scripts/internal/host/check_release_file.py --print-stages "$1"; }

          # The validate stages are the image validation gate (docs/IMAGES_VALIDATION.md),
          # appended to the list the job already builds so they cost a cache hit plus their own RUN.
          build --variant normal $(stages normal) $(stages validate-normal)

          # BINUTILS_TARGETS is consumed at the tail of `build`, so cross `build` reuses everything below it
          #   from the builder's local cache. Every stage above is re-parented and rebuilds in full,
          #   for package sets the normal variant has already built - which is why a PR stops after the gate.
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            build --variant cross $(stages cross) $(stages validate-cross)
          else
            build --variant cross build $(stages validate-cross)
          fi
