name: documentation

# Renders the repository's markdown as a site and publishes it to GitHub Pages.
#
# docs/details/generate.sh does the rendering and is what to run locally; this workflow only decides
# when it runs and where the result lands. docs/details/README.md covers the rest, including the
# repository setting that makes GitHub serve the gh-pages branch this pushes to.
#
# Runs on merges to main, never on a pull request, so documentation never stands between a change and its merge.
# Doxygen's warnings, and a render that fails outright, are reported as a dedicated issue that this
# workflow closes again once a run comes back clean.
#
# Deliberately not path-filtered. doxygen-filter.py rewrites a link according to whether its target exists,
# so renaming the Dockerfile or a script under scripts/install/ changes what the site should contain
# while touching no markdown at all. A render costs far less than a broken link on the published site.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write # pushes the rendered site to gh-pages
  issues: write # opens, updates and closes the doxygen diagnostics issue

concurrency:
  group: documentation-${{ github.ref }}
  # Cancelling a publish half way would leave gh-pages holding a partly updated site.
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Doxygen is pinned once, by `ARG DOXYGEN_RELEASE` in the Dockerfile, so a Renovate bump moves the
      # images and this site together; the theme is pinned in generate.sh, which no image installs.
      # Both are read from the script that fetches them, so the cache key cannot describe a different pair.
      - name: Resolve the pinned versions
        id: versions
        run: bash docs/details/generate.sh --print-versions >> "${GITHUB_OUTPUT}"

      - name: Restore the doxygen and theme downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: docs/details/.cache
          key: documentation-doxygen-${{ steps.versions.outputs.doxygen }}-theme-${{ steps.versions.outputs.theme }}

      - name: Render the documentation
        id: render
        run: bash docs/details/generate.sh --diagnostics doxygen-diagnostics.log

      # workflow_dispatch takes a ref, so this is what keeps a manual run on a feature branch
      # from force-pushing that branch's render over the published site.
      - name: Publish to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          folder: docs/output

      - name: Compose the diagnostics report
        id: diagnostics
        if: always() && github.ref == 'refs/heads/main'
        env:
          RENDER_OUTCOME: ${{ steps.render.outcome }}
        run: |
          set -euo pipefail

          log='doxygen-diagnostics.log'

          if [[ "${RENDER_OUTCOME}" == "success" && ! -s "${log}" ]]; then
              echo "resolved=true" >> "$GITHUB_OUTPUT"
              exit 0
          fi
          echo "resolved=false" >> "$GITHUB_OUTPUT"

          {
              echo "The documentation render reported problems."
              echo
              echo "- commit: ${GITHUB_SHA}"
              echo "- render: ${RENDER_OUTCOME}"
              echo "- run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              echo
              echo '```'
              if [[ -s "${log}" ]]; then
                  cat "${log}"
              else
                  echo "(no diagnostics captured: the render did not reach doxygen)"
              fi
              echo '```'
              echo
              echo "Reproduce, from a clone of this repository:"
              echo
              echo '```bash'
              echo "git checkout ${GITHUB_SHA}"
              echo "bash docs/details/generate.sh --diagnostics doxygen-diagnostics.log"
              echo '```'
              echo
              echo "Opened by .github/workflows/documentation.yml, rewritten on every run, and closed once a render comes back clean."
          } > doxygen-report.md

      - name: Report doxygen diagnostics
        if: always() && github.ref == 'refs/heads/main'
        uses: ./.github/actions/report-sticky-issue
        with:
          title: "documentation: doxygen diagnostics"
          body-file: doxygen-report.md
          resolved: ${{ steps.diagnostics.outputs.resolved }}
          close-comment: "Clean render at ${{ github.sha }}."
          token: ${{ github.token }}
