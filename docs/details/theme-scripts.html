<!--
  doxygen-awesome extensions, injected into the generated HTML header by docs/details/generate.sh.
  Code folding and copy-to-clipboard are left to doxygen's own implementations (HTML_CODE_FOLDING, HTML_COPY_CLIPBOARD).
-->
<!--
  PROJECT_LOGO copies logo.svg into the output, and the tab icon is that same file.
  PROJECT_ICON would declare it, but the header template it feeds calls every icon image/x-icon.
-->
<link rel="icon" href="$relpath^logo.svg" type="image/svg+xml"/>
<!-- Doxygen writes no meta description of its own; $projectbrief keeps the Doxyfile the only place it is spelled. -->
<meta name="description" content="$projectbrief"/>
<!--
  Open Graph, for the card a link to the site renders as.
  Both URLs are written in full. og:url is an identifier rather than a link, and $relpath^ resolves to
  the output root, which is empty on every page here; og:image follows it, so a move has one place to change.
  Every page carries the site root rather than its own address, so og:title names the site, not the page.
  og-card.png reaches the output through the Doxyfile's HTML_EXTRA_FILES,
  and its size is declared so that a renderer can lay the card out before it has fetched the bytes.
-->
<meta property="og:type" content="website"/>
<meta property="og:url" content="https://guillaumedua.github.io/cpp-toolchain/"/>
<meta property="og:title" content="$projectname"/>
<meta property="og:description" content="$projectbrief"/>
<meta property="og:image" content="https://guillaumedua.github.io/cpp-toolchain/og-card.png"/>
<meta property="og:image:width" content="1200"/>
<meta property="og:image:height" content="630"/>

<script type="text/javascript" src="$relpath^doxygen-awesome-darkmode-toggle.js"></script>
<script type="text/javascript" src="$relpath^doxygen-awesome-paragraph-link.js"></script>
<script type="text/javascript" src="$relpath^doxygen-awesome-interactive-toc.js"></script>
<script type="text/javascript">
    DoxygenAwesomeDarkModeToggle.init()
    DoxygenAwesomeParagraphLink.init()
    DoxygenAwesomeInteractiveToc.init()
</script>
<script type="module">
    // doxygen writes its own mermaid bootstrap from HTML_COLORSTYLE, which is LIGHT here because the theme
    // requires it, so every diagram would stay light under the theme's dark mode.
    // The URL has to match the Doxyfile's MERMAID_JS_URL character for character, for the reason given there.
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';

    const diagrams = () => document.querySelectorAll('pre.mermaid');
    const themeFor = enabled => enabled ? 'dark' : 'default';

    // Module scripts run once the document is parsed and before doxygen's startOnLoad render,
    // so the source is captured while it is still the fence's text and the first render already uses the right theme.
    for (const diagram of diagrams()) {
        diagram.dataset.mermaidSource = diagram.innerHTML;
    }
    mermaid.initialize({ startOnLoad: true, theme: themeFor(DoxygenAwesomeDarkModeToggle.darkModeEnabled) });

    const enableDarkMode = DoxygenAwesomeDarkModeToggle.enableDarkMode.bind(DoxygenAwesomeDarkModeToggle);
    DoxygenAwesomeDarkModeToggle.enableDarkMode = enable => {
        enableDarkMode(enable);
        for (const diagram of diagrams()) {
            diagram.removeAttribute('data-processed');
            diagram.innerHTML = diagram.dataset.mermaidSource;
        }
        mermaid.initialize({ theme: themeFor(enable) });
        mermaid.run({ nodes: diagrams() });
    };
</script>
